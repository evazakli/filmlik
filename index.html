<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>filmlik</title>
  <meta name="description" content="Bu akşam ne izleyeceğine karar veremedin mi? Tek tıkla 4.682 seçkin IMDb 7.0+ film arasından şansına düşen filmi keşfet!">
  <meta name="theme-color" content="#0d0e17">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="filmlik">

  <!-- Sekme İkonları (Favicon & Apple Touch Icon) -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <!-- WhatsApp, Telegram, Discord, Twitter/X Paylaşım Önizleme Kartı (Open Graph) -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="tr_TR">
  <meta property="og:site_name" content="filmlik">
  <meta property="og:title" content="filmlik">
  <meta property="og:description" content="Tek tıkla 4.682 seçkin IMDb 7.0+ film arasından tamamen rastgele, yüksek puanlı bir film önerisi al!">
  <meta property="og:image" content="https://evazakli.github.io/film-oneri/og-preview.jpg">
  <meta property="og:image" content="og-preview.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="filmlik">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="filmlik">
  <meta name="twitter:description" content="Tek tıkla 4.682 seçkin IMDb 7.0+ film arasından tamamen rastgele, yüksek puanlı bir film önerisi al!">
  <meta name="twitter:image" content="https://evazakli.github.io/film-oneri/og-preview.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;700&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="vortex-canvas" aria-hidden="true"></canvas>
  <div class="spotlight-reveal-layer" aria-hidden="true"></div>
  <div class="cinema-grain" aria-hidden="true"></div>

  <main id="main-content" class="main-stage">
    <h1 id="main-title" tabindex="-1" class="visually-hidden">filmlik</h1>

    <!-- İSTEĞE BAĞLI TÜR VE YIL FİLTRESİ -->
    <search class="genre-bar" id="genre-bar" aria-label="Film filtreleri">
      <div class="filter-control">
        <label for="genre-select" class="visually-hidden">Film Türü</label>
        <select id="genre-select" name="genre" class="genre-select">
          <option value="all" selected>Tüm Türler</option>
          <option value="Action">Aksiyon</option>
          <option value="Adventure">Macera</option>
          <option value="Animation">Animasyon</option>
          <option value="Biography">Biyografi</option>
          <option value="Comedy">Komedi</option>
          <option value="Crime">Suç</option>
          <option value="Documentary">Belgesel</option>
          <option value="Drama">Dram</option>
          <option value="Family">Aile</option>
          <option value="Fantasy">Fantastik</option>
          <option value="Film-Noir">Kara Film (Noir)</option>
          <option value="History">Tarih</option>
          <option value="Horror">Korku</option>
          <option value="Music">Müzik</option>
          <option value="Musical">Müzikal</option>
          <option value="Mystery">Gizem</option>
          <option value="Romance">Romantik</option>
          <option value="Sci-Fi">Bilim Kurgu</option>
          <option value="Sport">Spor</option>
          <option value="Thriller">Gerilim</option>
          <option value="War">Savaş</option>
          <option value="Western">Western</option>
        </select>
      </div>

      <fieldset class="year-filter-group" id="year-filter-group">
        <legend class="visually-hidden">Yıl Aralığı (Başlangıç ve Bitiş Yılı)</legend>
        <label for="year-from-select" class="visually-hidden">Başlangıç Yılı</label>
        <select id="year-from-select" name="year_from" class="year-select">
          <option value="1915" selected>1915</option>
          <option value="1930">1930</option>
          <option value="1940">1940</option>
          <option value="1950">1950</option>
          <option value="1960">1960</option>
          <option value="1970">1970</option>
          <option value="1980">1980</option>
          <option value="1990">1990</option>
          <option value="2000">2000</option>
          <option value="2010">2010</option>
          <option value="2015">2015</option>
          <option value="2020">2020</option>
          <option value="2027">2027</option>
        </select>
        <span class="year-range-sep" aria-hidden="true">–</span>
        <label for="year-to-select" class="visually-hidden">Bitiş Yılı</label>
        <select id="year-to-select" name="year_to" class="year-select">
          <option value="2027" selected>2027</option>
          <option value="2020">2020</option>
          <option value="2015">2015</option>
          <option value="2010">2010</option>
          <option value="2000">2000</option>
          <option value="1990">1990</option>
          <option value="1980">1980</option>
          <option value="1970">1970</option>
          <option value="1960">1960</option>
          <option value="1950">1950</option>
          <option value="1940">1940</option>
          <option value="1930">1930</option>
          <option value="1915">1915</option>
        </select>
      </fieldset>

      <fieldset class="rating-filter-group" id="rating-filter-group">
        <legend class="visually-hidden">IMDb Puan Aralığı (0 ile 10 arası)</legend>
        <span class="rating-bound-label" aria-hidden="true">0</span>
        <div class="rating-slider-stage" id="rating-slider-stage">
          <div class="rating-track-line" id="rating-track-line" aria-hidden="true"></div>
          <output for="rating-min-slider" class="rating-thumb-badge" id="rating-min-badge">7.0</output>
          <output for="rating-max-slider" class="rating-thumb-badge" id="rating-max-badge">10</output>
          <label for="rating-min-slider" class="visually-hidden">En Düşük IMDb Puanı</label>
          <input
            type="range"
            id="rating-min-slider"
            name="rating_min"
            class="rating-range-input rating-min-input"
            min="0"
            max="10"
            step="0.1"
            value="7.0"
            aria-valuetext="En düşük puan 7.0"
          >
          <label for="rating-max-slider" class="visually-hidden">En Yüksek IMDb Puanı</label>
          <input
            type="range"
            id="rating-max-slider"
            name="rating_max"
            class="rating-range-input rating-max-input"
            min="0"
            max="10"
            step="0.1"
            value="10.0"
            aria-valuetext="En yüksek puan 10.0"
          >
        </div>
        <span class="rating-bound-label" aria-hidden="true">10</span>
      </fieldset>
    </search>

    <!-- SADECE SEÇ BUTONU (İlk ekranda merkezde) -->
    <div class="portal-trigger-zone" id="portal-trigger-zone">
      <div class="portal-rings" aria-hidden="true"></div>
      <div class="portal-core-glow" aria-hidden="true"></div>
      <button type="button" class="quantum-roll-btn" id="roll-movie-btn">
        <svg class="btn-spark-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <span id="roll-btn-text">FİLM SEÇ</span>
      </button>
    </div>

    <!-- SÜRPRİZ GÖRSEL ŞOV SAHNESİ (Yazısız, saf görsel efekt) -->
    <section class="spectacle-stage" id="spectacle-stage" aria-label="Film seçiliyor" hidden>
      <div class="anamorphic-flare" aria-hidden="true"></div>
      <div class="shockwave-ring" id="shockwave-ring" aria-hidden="true"></div>
      <div class="poster-vortex-track" id="spectacle-visual-box" aria-hidden="true"></div>
    </section>

    <!-- SEÇİLEN FİLM KARTI -->
    <div class="movie-artifact-wrapper" id="movie-artifact-wrapper" hidden>
      <article class="movie-card" id="movie-card">
        <img
          class="movie-poster"
          id="movie-poster"
          src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
          alt="Seçilen film afişi"
          width="320"
          height="480"
        >

        <header class="movie-header">
          <h2 class="movie-title" id="movie-title-heading" tabindex="-1">
            <a id="movie-title-link" href="https://www.imdb.com/" target="_blank" rel="noopener noreferrer">
              Film
            </a>
          </h2>
          <p class="movie-original-title" id="movie-original-title" hidden></p>
        </header>

        <div class="movie-body">
          <div class="meta-ribbon">
            <span class="meta-chip imdb-score-chip" id="movie-rating-chip">★ --</span>
            <span class="meta-chip" id="movie-year-chip">----</span>
            <span class="meta-chip" id="movie-runtime-chip">-- dk</span>
          </div>

          <ul class="genre-list" id="movie-genres-list" role="list" aria-label="Film Türleri"></ul>

          <p class="movie-plot" id="movie-plot-text"></p>

          <dl class="credits-grid" id="movie-credits-grid">
            <div class="credit-block">
              <dt>Yönetmen</dt>
              <dd id="movie-director-text">—</dd>
            </div>
            <div class="credit-block">
              <dt>Oyuncular</dt>
              <dd id="movie-cast-text">—</dd>
            </div>
          </dl>
        </div>

        <footer class="movie-footer">
          <button type="button" class="action-btn primary-reroll" id="reroll-btn">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
              <path d="M21 2v6h-6"></path>
              <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
              <path d="M3 22v-6h6"></path>
              <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
            </svg>
            <span>FİLM SEÇ</span>
          </button>

          <a class="action-btn imdb-link" id="imdb-external-btn" href="https://www.imdb.com/" target="_blank" rel="noopener noreferrer">
            <span>IMDb</span>
            <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
              <polyline points="15 3 21 3 21 9"></polyline>
              <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
          </a>
        </footer>
      </article>
    </div>
  </main>

  <script src="movies-data.js" defer fetchpriority="high"></script>
  <script src="app.js" defer></script>
</body>
</html>
