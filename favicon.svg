<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#251e42"/>
      <stop offset="60%" stop-color="#111222"/>
      <stop offset="100%" stop-color="#090a12"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5c518"/>
      <stop offset="50%" stop-color="#e040fb"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#f59f00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGlow)" stroke="url(#ringGrad)" stroke-width="4"/>

  <!-- Outer Dashed Cinema Portal Ring -->
  <circle cx="64" cy="64" r="46" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.85"/>

  <!-- Inner Glowing Ring -->
  <circle cx="64" cy="64" r="36" fill="none" stroke="#f5c518" stroke-width="1.5" opacity="0.4"/>

  <!-- Central Play Emblem with Spark -->
  <path d="M53 43.5 C53 40.5 56.3 38.7 58.9 40.2 L85.5 56.2 C88.0 57.7 88.0 61.3 85.5 62.8 L58.9 78.8 C56.3 80.3 53 78.5 53 75.5 Z" fill="url(#playGrad)" filter="url(#glow)" transform="translate(0, 4.5)"/>

  <!-- Top Spark Star -->
  <path d="M94 24 L96.5 31.5 L104 34 L96.5 36.5 L94 44 L91.5 36.5 L84 34 L91.5 31.5 Z" fill="#00e5ff"/>
</svg>
